[project]
name = "t212-tv"
version = "0.1.0"
description = "Turn Trading 212 CSV exports into a TradingView watchlist, layout and entry lines"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
t212-tv = "t212_tv.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/t212_tv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
